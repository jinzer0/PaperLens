name: 개발 작업
description: 해결할 문제와 기대 동작을 기록합니다.
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제와 목표
      description: 해결할 문제와 이 작업이 필요한 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작
      description: 사용자가 할 수 있어야 하는 동작과 확인 방법을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 참고 사항
      description: 관련 이슈, 기존 명세, 재현 방법, 적용 범위나 제약이 있으면 적어 주세요.

  - type: markdown
    attributes:
      value: 보호 작업과 원격 작업의 권한은 `docs/ai-governance.md`을 따릅니다.
