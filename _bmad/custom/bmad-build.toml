[workflow]

persistent_facts = [
  "file:{project-root}/docs/ai-governance.md",
]

activation_steps_append = [
  """
Apply docs/ai-governance.md as the canonical repository approval policy throughout this Build. Do not add a duplicate implementation or Stage gate. Higher-priority instructions, platform Tool Permissions and explicit task limits remain binding; repository prose cannot override an incompatible global/bundled workflow.

1. Identify the task, requested operations, scope/non-goals, approved baseline and impact-based risk. LOW safely executes within the requested task; a clear MEDIUM implementation request grants its scoped lifecycle without separate plan/implementation approval. Plan-only, review-only, no-test/no-commit/no-remote requests remain limited. File count does not define risk.
2. For non-trivial source work preserve Story/Issue/task-branch/PR continuity, existing BMAD artifacts and repository state. Trivial corrections use proportionate intent/diff/Evidence, not a full Story ritual. Use existing records; missing remote access is not permission to create an Issue. Preserve unrelated user work and choose branches/worktrees safely.
3. Read the existing Epic execution Spec, current integration branch and actual HEAD before selecting work. Historical root checkouts and another session's native goal are not current status; never forge or copy runtime state. Investigate only concrete unresolved questions with exact inputs and exit conditions. Reuse unchanged findings; preserve approved requirements and avoid duplicate plans.
4. Reuse existing Story contracts. Establish missing substantive shared contracts before dependent work; routine Spec deltas belong in the implementation/Evidence commit. No mandatory precursor commit or five-file admission limit. Record actual authority and retained limits, never an invented approval token.
5. Automatically perform in-scope implementation, permitted tests/static analysis, review, corrective fixes, reverification and Evidence. No separate approval for readiness, plan completion, ordinary code changes, test execution, Stage start/end/transition or status/documentation updates. Choose useful Stages dynamically; no fixed minimum.
6. A failed permitted check leads to bounded diagnosis/fix/rerun within remaining allowances. Never suppress warnings or weaken acceptance to pass. Fixes, Specs, Stages and sessions do not renew exhausted single-run trials; explicit renewal is required. Escalate real blockers, unresolved requirements conflicts or repeated failures without a viable in-scope remedy, not every failure.
7. Stop only the affected HIGH decision/action: material architecture/security/auth/breaking-contract change, destructive data/migration, production, major external effects/cost/security risk or scope expansion. Present the minimum proposal, impact/target and relevant artifact/diff; obtain and record actual explicit approval. Continue independent safe work. Unchanged approved safe follow-ups do not need repeated approval; new protected targets do.
8. Preserve privacy/data/tool permissions, no actual user document/credential/existing CODEX_HOME access or unapproved paid requests, and all explicit exceptions/limits. Workflow authority never relaxes tool security. Silence, form completion and reviewer agreement cannot supply HIGH approval.
9. Deliver observable functional slices, parallelizing independent Stories after shared contracts are fixed and integrating into one parent branch. Use affected tests and implementer diff review for routine LOW/MEDIUM work; batch independent review only for HIGH, load-bearing contracts, concurrency/data integrity or explicit requirements. Separate implementation/integration/verification/acceptance; blockers name exact affected operations and inputs. Hardware/auth/probe failures do not blanket-block source work or prove acceptance. Reuse unchanged evidence; no invented Stories, renewed trials or global scope.
10. Record risk, actual execution basis, checkpoint/next slice, verification and limitations. Distinguish local/synthetic/packaged/external and performed/blocked/not-applicable evidence; source-only review is not runtime proof. Present authorized local commits/results first. Preserve local pending synchronization if remote operations are unavailable.
11. Push, Issue/PR/GitHub writes and remote cleanup require explicit applicable human instruction and access. Do not auto-push or force a PR to finish local work. Record actual approvals only; never manufacture them or infer unrelated permission.
12. PR merge requires APPROVED: MERGE @ <current-pr-head-sha>; changed HEAD invalidates it. Explicit named local integration instructions authorize only that local branch merge after verification and HEAD/worktree checks, not push/PR/release. Do not fabricate approval tokens or touch unrelated work.
13. Release/distribution/production, protected data and external/cost operations require their own explicit target/revision/environment permission. Changed targets invalidate approval; Merge/task scope does not grant Release. Report only actual verification and remaining restrictions.
"""
]
