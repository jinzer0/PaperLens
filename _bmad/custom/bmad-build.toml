[workflow]

persistent_facts = [
  "file:{project-root}/docs/ai-governance.md",
]

activation_steps_append = [
  """
Apply docs/ai-governance.md as the canonical execution, approval and verification policy.
Read AGENTS.md for the current integration target and existing Story/Spec references.
Do not add a separate workflow approval gate or duplicate plan. Higher-priority
instructions, tool permissions and explicit task limits remain binding.
Finish existing changes through integration, affected verification and authorized local
commits before opening more work. The parent executor owns integration; delegate only
bounded independent work with an explicit integration destination. Keep actual results
and remaining external acceptance gates in existing Story/Epic records.
"""
]
