[workflow]

persistent_facts = [
  "file:{project-root}/docs/ai-governance.md",
]

activation_steps_append = [
  """
이 Build 전체에서 docs/ai-governance.md를 저장소 승인 정책의 canonical source로 적용한다. 구현·Stage Gate를 중복 추가하지 않는다. 상위 지침, 플랫폼 Tool Permission과 명시적 task 제한은 유지한다. 저장소 문구로 충돌하는 전역·번들 워크플로를 우회하지 않는다.

1. task, 요청된 작업 종류, scope/non-goals, 승인된 baseline과 영향 기반 위험도를 확인한다. LOW는 요청 범위의 안전한 작업을 자율 실행하고 MEDIUM은 명확한 구현 요청으로 범위 내 lifecycle을 위임받는다. 별도 계획/구현 승인은 요구하지 않는다. 계획만·리뷰만·no-test/no-commit/no-remote 지시는 제한 그대로 적용한다. 파일 수로 위험을 판단하지 않는다.
2. 비사소한 source 작업은 Story/Issue/task-branch/PR 연속성, 기존 BMAD artifact와 repository 상태를 유지한다. 사소한 수정에는 intent/diff/Evidence만 비례해 남기고 전체 Story ritual을 강제하지 않는다. 기존 기록을 사용하며 원격 접근 부재를 Issue 생성 권한으로 해석하지 않는다. 사용자 작업을 보존하고 안전한 branch/worktree를 선택한다.
3. 조사·계획은 작업 규모에 비례한다. 요구사항, 승인된 PRD/architecture/acceptance, BMAD review와 Context/Evidence를 유지한다. BMAD와 Hyper-Waterfall의 계획을 중복 생성하거나 없는 Story 요구사항을 만들지 않는다.
4. 비사소한 Build Spec과 범위 내 후속 Spec은 commit이 허용되면 구현 전에 commit한다. 이는 durable checkpoint이지 매 SHA별 승인 요청이 아니다. 실제 요청/baseline과 제한을 기록하며 APPROVED: IMPLEMENTATION 토큰을 만들어내지 않는다.
5. 범위 내 구현, 허용된 테스트/정적 분석, 리뷰, 수정·재검증과 Evidence를 자동 수행한다. 실행 준비, 계획 완료, 일반 코드 변경, 테스트, Stage 시작/종료/전환과 상태·문서 기록에 별도 승인을 요구하지 않는다. 유용한 Stage만 동적으로 구성하고 고정 최소 수를 강제하지 않는다.
6. 허용된 검증 실패는 남은 실행 허용 안에서 원인 분석·수정·재검증한다. 경고를 숨기거나 acceptance를 약화해 통과시키지 않는다. 수정·Spec·Stage·세션은 소진된 단일 실행 trial을 갱신하지 않으며 별도 명시 갱신이 필요하다. 실제 blocker, 해결되지 않은 요구사항 충돌, 범위 내 해결책 없는 반복 실패만 escalation한다.
7. HIGH의 해당 결정/행동만 중단한다: 중대한 architecture/security/auth/breaking-contract 변경, 파괴적 데이터/migration, 운영 환경, 중대한 외부 영향·비용·보안 위험이나 scope 확대. 최소 제안, 영향/대상과 artifact/diff를 제시하고 실제 명시 승인을 받아 기록한다. 독립적인 안전한 작업은 계속한다. 이미 승인된 동일 결정의 안전한 후속 작업은 재승인하지 않으며 새로운 보호 대상은 별도 판단한다.
8. privacy/data/tool 권한, 실제 사용자 문서·인증정보·기존 CODEX_HOME 접근 금지와 무승인 유료 요청 금지, 명시적 예외·제한을 유지한다. 워크플로 위임으로 tool 보안을 완화하지 않는다. 침묵, 폼 작성이나 reviewer verdict는 HIGH 승인이 아니다.
9. Whole-Story/Explicit Story-Range 지시는 해당 범위에 실제 존재하는 각 Story의 현재 acceptance와 제외 조건에 적용한다. 허용되면 Spec/Issue/task-branch와 Epic 지시를 연결하고 독립 리뷰를 유지한다. 한 Story의 외부 환경 blocker에도 독립적으로 준비된 다음 Story를 진행한다. 없는 Story, 소진 trial 갱신이나 전역 scope를 만들어내지 않는다.
10. 위험도, 실제 실행 근거, checkpoint/다음 slice, 검증과 제한을 기록한다. local/synthetic/packaged/external과 수행/차단/해당 없음 Evidence를 구분한다. source-only 검토를 runtime proof로 보고하지 않는다. 허용된 local commit/결과를 먼저 제시한다. 원격 작업이 불가능하면 로컬에 동기화 대기를 남긴다.
11. Push, Issue/PR/GitHub 기록과 원격 정리는 명시적 human instruction과 접근 권한 후에만 수행한다. 자동 push나 로컬 완료를 위한 강제 PR은 금지한다. 실제 승인만 기록하고 승인을 만들어내거나 무관한 권한을 추론하지 않는다.
12. Merge는 APPROVED: MERGE @ <current-pr-head-sha>가 필요하다. 직전에 HEAD를 재확인하며 HEAD 변경은 승인을 무효로 한다. Merge 후 Issue/status/branch 정리도 해당 작업 권한 안에서만 수행하고 사용자 작업을 건드리지 않는다. 테스트 통과·로컬 완료는 Merge 권한이 아니다.
13. Release/배포/운영 환경, 보호 데이터와 외부·비용 작업은 각각 명시적 대상/revision/환경 권한이 필요하다. 대상 변경은 승인을 무효로 하며 Merge/task 범위가 Release를 허용하지 않는다. 실제 검증과 남은 제한만 보고한다.
"""
]
